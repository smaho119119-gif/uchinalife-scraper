name: Daily Property Scraper (parallel)

# 8カテゴリを8台で同時に収集し、最後に1通だけメールを送る。
# リンク収集はサイトの検索API（--api）: 市町村・地区の区画ごとに「サイトが言う件数どおり受け取れたか」を照合する。
# 一覧ページをブラウザでめくる旧方式は、空ページ・時間切れ・ずれで黙って取りこぼしていた（2026-09-25 実測で戸建398件）。
# report ジョブは if: always() なので、どのジョブが失敗しても必ずメールが出る。
on:
  # 毎日 03:17 JST（UTC 18:17）。毎時0分は世界中の起動が集中して遅れる・飛ばされるので避ける
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 本番（DBに書く） / collect-only = リンク収集だけ（DBに書かない試運転） / mail-test = メール送信だけ試す"
        type: choice
        options: [full, collect-only, mail-test]
        default: full
      sold_mode:
        description: "売れた判定: normal = 詳細ページで確認して確定 / dry-run = 確認だけ（書かない） / cleanup = 候補が多くても止めない（溜まった分の一掃） / skip = 判定しない"
        type: choice
        options: [normal, dry-run, cleanup, skip]
        default: normal
  # 試運転: このブランチへの push では collect-only で動かす（本番DBに触れない）
  push:
    branches: [actions-parallel]
    paths:
      - ".github/workflows/scrape-parallel.yml"
      - "integrated_scraper.py"

concurrency:
  group: scraper
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keepalive（60日無動作での自動停止を防ぐ）

env:
  # 売れた判定のモード（定期実行は normal＝詳細ページで確認して確定。2026-09-25 一掃済み）
  SOLD_MODE: ${{ inputs.sold_mode || 'normal' }}
  SCRAPER_SKIP_SOLD: ${{ inputs.sold_mode == 'skip' && '1' || '' }}
  SCRAPER_SOLD_DRY_RUN: ${{ inputs.sold_mode == 'dry-run' && '1' || '' }}
  SCRAPER_ALLOW_MASS_SOLD: ${{ (inputs.sold_mode == 'cleanup' || inputs.sold_mode == 'dry-run') && '1' || '' }}
  MODE: ${{ github.event_name == 'push' && 'collect-only' || inputs.mode || 'full' }}

jobs:
  scrape:
    if: ${{ inputs.mode != 'mail-test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        category: [jukyo, jigyo, yard, parking, tochi, mansion, house, sonota]
    env:
      DATABASE_TYPE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      STORAGE_SUPABASE_URL: ${{ secrets.STORAGE_SUPABASE_URL }}
      STORAGE_SUPABASE_KEY: ${{ secrets.STORAGE_SUPABASE_KEY }}
      # PROPERTY AI（東京）の市場データへ同期（合言葉つきの専用入口のみ）
      PROPERTY_AI_URL: ${{ secrets.PROPERTY_AI_URL }}
      PROPERTY_AI_KEY: ${{ secrets.PROPERTY_AI_KEY }}
      PROPERTY_AI_SYNC_TOKEN: ${{ secrets.PROPERTY_AI_SYNC_TOKEN }}
      SCRAPER_MAX_WORKERS: 2
      SCRAPER_MAX_RPS: 2
      SCRAPER_COLLECTION_TIMEOUT: 3600
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.0-${{ runner.os }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scrape ${{ matrix.category }}
        run: |
          mkdir -p logs output
          EXTRA=""
          if [ "$MODE" = "collect-only" ]; then EXTRA="--collect-only"; fi
          python -u integrated_scraper.py --api --no-mail \
            --categories "${{ matrix.category }}" \
            --report-json "result_${{ matrix.category }}.json" $EXTRA 2>&1 | tee "logs/${{ matrix.category }}.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.category }}
          path: |
            result_${{ matrix.category }}.json
            logs/${{ matrix.category }}.log
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: scrape
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      # XServer は海外IP（Actions）を 554 で拒否するので、東京の中継から送る
      MAIL_RELAY_URL: ${{ secrets.MAIL_RELAY_URL }}
      MAIL_RELAY_TOKEN: ${{ secrets.MAIL_RELAY_TOKEN }}
      # HTMLレポートの推移・カレンダー用（読み取りのみ）
      DATABASE_TYPE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results

      - name: Summary
        run: |
          python - <<'PY'
          import glob, json
          for p in sorted(glob.glob("results/**/result_*.json", recursive=True)):
              d = json.load(open(p, encoding="utf-8"))
              for c, s in (d.get("collection") or {}).items():
                  print(c, s, d.get("by_category", {}).get(c))
          PY

      - name: Send mail (always)
        if: env.MODE == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs
          python actions_report.py results

      - name: Mail test
        if: env.MODE == 'mail-test'
        run: |
          mkdir -p logs
          python -c "import sys; from notify_failure import send; sys.exit(send('【試験】うちなーらいふ GitHub Actions からの送信', 'GitHub Actions（海外）から東京の中継を通した試験です。', force=True))"

      - name: Keepalive (prevent 60-day auto-disable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape-parallel.yml/enable" || true
